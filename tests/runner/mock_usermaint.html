<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>User Profiles</title>
<!--
  TEST FIXTURE ONLY: a small imitation of the classic PeopleTools USERMAINT
  component, used to exercise psagent.js mechanics (AJAX round trips, a full
  page reload on Add, tabs, grids with "+" row buttons, message boxes and the
  Saved indicator). Layout and most IDs follow a real PeopleTools 8.5x
  USERMAINT checked on 2026-10-22: Description is entered on the ID tab, and a
  changed EMPLID is only sent to the server when focus moves to the next field,
  whose reply redraws the tab. Message boxes are drawn in the TOP window
  (#pt_modals > #alertmsg, one OK button) even when this page is in a frame,
  "already exists" is inline search-page text (#PTS_CRITTEXT_DISP), and the
  search page opens in Find mode unless Action=A (both as on 2026-10-23).
  Some IDs intentionally differ from the task YAML so the label/column
  fallbacks are exercised. It is not real PeopleSoft HTML.
-->
<style>
  body { font-family: Arial, sans-serif; font-size: 12px; margin: 12px; }
  #WAIT_win0 { position: fixed; top: 4px; right: 4px; background: #ffc; padding: 4px 8px; display: none; }
  #SAVED_win0 { position: fixed; top: 4px; right: 4px; background: #cfc; padding: 4px 8px; display: none; }
  .tabs a, .tabs span { margin-right: 12px; }
  .tabs span { font-weight: bold; }
  table.grid th { text-align: left; }
</style>
</head>
<body>
<div id="WAIT_win0">Processing...</div>
<div id="SAVED_win0">Saved</div>
<form name="win0" id="win0" onsubmit="return false"><div id="page"></div></form>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var EXISTING = ['PS', 'EXISTS'];
  var ROLES = ['EMPLOYEE', 'PeopleSoft User', 'Manager'];
  var data = { OPRID: q.get('OPRID') || '', DESCR: '', SYMBOLICID: '', PWD: '', PWD2: '', OPRCLASS: '',
               IDTYPE: 'NON', EMPLID: '', ROLES: [''] };
  var tab = 'General';
  var addMode = q.get('Action') === 'A' || !!data.OPRID;
  var searchMsg = '';
  window.__mockSaved = null;
  window.__mockRoundTrips = 0;

  function el(id) { return document.getElementById(id); }
  /* Like PeopleSoft: the message box goes to the TOP window, also when this page is in a frame */
  function msg(text) {
    var d = document;
    try { if (window.top !== window && window.top.document.body) d = window.top.document; } catch (e) {}
    var host = d.getElementById('pt_modals');
    if (!host) { host = d.createElement('div'); host.id = 'pt_modals'; d.body.appendChild(host); }
    host.innerHTML = '<div id="ptMod_0" style="position:fixed;top:30%;left:30%;z-index:2147483646;border:2px solid #900;'
      + 'background:#fff;padding:16px;font:12px Arial"><a href="#" style="display:inline-block;width:2px">&nbsp;</a>'
      + '<span id="alertmsg" class="popupText"></span><br><input type="button" id="#ICOK" value="OK"></div>';
    host.querySelector('#alertmsg').textContent = text;
    host.querySelector('input').onclick = function () { host.innerHTML = ''; };
  }

  /* Every action is a server round trip: show the processing indicator, then re-render. */
  function roundTrip(fn) {
    window.__mockRoundTrips++;
    el('WAIT_win0').style.display = 'block';
    el('SAVED_win0').style.display = 'none';
    setTimeout(function () { el('WAIT_win0').style.display = 'none'; fn(); }, 350);
  }

  var pending = false;   /* changed field waiting for the next focus, like PS deferred processing */
  document.addEventListener('focusin', function (e) {
    if (pending && e.target.id !== pending) {
      /* The reply reflects the server state at this moment: anything typed meanwhile is lost */
      var server = JSON.stringify(data);
      pending = false;
      roundTrip(function () { data = JSON.parse(server); render(); });
    }
  });

  window.submitAction_win0 = function (form, name) {
    if (name === 'PTS_CFG_CL_WRK_PTS_PAGE_TOGGLE') {
      roundTrip(function () { addMode = !addMode; searchMsg = ''; render(); });
    } else if (name === 'PTS_CFG_CL_WRK_PTS_ADD_BTN') {
      var id = el('PSOPRDEFN_SRCH_OPRID').value.trim().toUpperCase();
      roundTrip(function () {
        if (!id) return msg('Enter a User ID.');
        if (EXISTING.indexOf(id) >= 0) {
          searchMsg = "The value you tried to add already exists. Select it below if you'd like to update it, or specify a new value in the fields above.";
          return render();
        }
        location.href = location.pathname + '?Action=A&OPRID=' + encodeURIComponent(id);   /* full reload */
      });
    } else if (name.indexOf('#ICPanel') === 0) {
      roundTrip(function () { tab = name.slice(8); render(); });
    } else if (/\$new\$/.test(name)) {
      roundTrip(function () { data.ROLES.push(''); render(); });
    } else if (name === '#ICSave') {
      roundTrip(save);
    }
  };

  window.chg = function (input, key, idx) {          /* PS-style onchange: FieldChange round trip */
    var v = input.type === 'checkbox' ? input.checked : input.value;
    if (idx != null) data[key][idx] = v; else data[key] = v;
    if (key === 'ROLES' && v && ROLES.indexOf(v) < 0) return roundTrip(function () { msg('Invalid value -- press the prompt button or hyperlink for a list of valid values (15,11)'); });
    if (key === 'IDTYPE') return roundTrip(render);   /* attribute grid appears */
    if (key === 'EMPLID') { pending = input.id; return; }
    roundTrip(function () {});
  };

  function save() {
    if (!data.DESCR) return msg('Description is required.');
    if (!data.PWD || data.PWD !== data.PWD2) return msg('Password and Confirm Password do not match. (48,14)');
    if (!data.SYMBOLICID) return msg('Symbolic ID is required.');
    window.__mockSaved = JSON.parse(JSON.stringify(data));
    el('SAVED_win0').style.display = 'block';
  }

  function input(id, key, label, type) {
    return '<label for="' + id + '">' + label + ':</label> <input type="' + (type || 'text') + '" id="' + id + '" value="'
      + (type === 'password' ? '' : data[key]) + '" onchange="chg(this,\'' + key + '\')"><br>';
  }

  function tabs() {
    return '<div class="tabs">' + ['General', 'ID', 'Roles'].map(function (t, i) {
      return t === tab ? '<span id="PSTAB' + i + '">' + t + '</span>'
        : '<a id="ICTAB_' + i + '" href="javascript:submitAction_win0(document.win0,\'#ICPanel' + t + '\')">' + t + '</a>';
    }).join('') + '</div>';
  }

  function render() {
    var p = el('page');
    if (!data.OPRID) {
      var toggle = '<a id="PTS_CFG_CL_WRK_PTS_PAGE_TOGGLE" href="javascript:submitAction_win0(document.win0,\'PTS_CFG_CL_WRK_PTS_PAGE_TOGGLE\')">'
        + (addMode ? 'Find an Existing Value' : 'Add a New Value') + '</a>';
      p.innerHTML = addMode
        ? '<h2>User Profiles</h2><h3>Add a New Value</h3>' + toggle + '<br>'
          + (searchMsg ? '<span id="PTS_CRITTEXT_DISP" class="PSSRCHINSTRUCTIONS">' + searchMsg + '</span><br>' : '')
          + '<label for="PSOPRDEFN_SRCH_OPRID">User ID:</label> <input type="text" id="PSOPRDEFN_SRCH_OPRID"> '
          + '<input type="button" id="PTS_CFG_CL_WRK_PTS_ADD_BTN" name="PTS_CFG_CL_WRK_PTS_ADD_BTN" value="Add" onclick="submitAction_win0(this.form,this.name)">'
        : '<h2>User Profiles</h2><h3>Find an Existing Value</h3>' + toggle + '<br>'
          + '<label for="PSOPRDEFN_SRCH_OPRID">User ID begins with:</label> <input type="text" id="PSOPRDEFN_SRCH_OPRID">';
      return;
    }
    /* Like PeopleSoft: the search key is still on the page (hidden) and set by script after Add */
    var h = '<h2>User Profiles</h2>' + tabs() + '<div>User ID: <b>' + data.OPRID + '</b></div>'
      + '<input type="text" id="PSOPRDEFN_SRCH_OPRID" style="display:none">';
    setTimeout(function () { var k = el('PSOPRDEFN_SRCH_OPRID'); if (k) k.value = data.OPRID; }, 300);
    if (tab === 'General') {
      h += '<label for="PSOPRDEFN_SYMBOLICID">Symbolic ID:</label> <select id="PSOPRDEFN_SYMBOLICID" onchange="chg(this,\'SYMBOLICID\')">'
        + ['', 'SYSADM1', 'SYSADM2'].map(function (o) { return '<option value="' + o + '"' + (data.SYMBOLICID === o ? ' selected' : '') + '>' + o + '</option>'; }).join('')
        + '</select><br>'
        + input('PSUSRPRFL_WRK_PTPSWDCLEARTXTINPT', 'PWD', 'New Password', 'password')
        + input('PSUSRPRFL_WRK_PTPSWDCLEARTXTCONF', 'PWD2', 'Confirm Password', 'password')
        + input('PSOPRDEFN_OPRCLASS', 'OPRCLASS', 'Primary');
    } else if (tab === 'ID') {
      /* IDs differ from the YAML on purpose: found by label / column header instead */
      h += '<label for="OPRALIASTYPE_X">ID Type:</label> <select id="OPRALIASTYPE_X" onchange="chg(this,\'IDTYPE\')">'
        + [['NON', 'None'], ['EMP', 'Employee'], ['CUS', 'Customer']].map(function (o) {
          return '<option value="' + o[0] + '"' + (data.IDTYPE === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('')
        + '</select>';
      if (data.IDTYPE === 'EMP') {
        h += '<table class="grid"><tr><th>Attribute Name</th><th>Attribute Value</th></tr>'
          + '<tr><td>Employee ID</td><td><input type="text" id="ATTRVAL_X$0" value="' + data.EMPLID + '" onchange="chg(this,\'EMPLID\')"></td></tr></table>';
      }
      h += '<h4>User Description</h4>' + input('PSOPRDEFN_DVW_OPRDEFNDESC$0', 'DESCR', 'Description:');
    } else {
      h += '<table class="grid"><tr><th>*Role Name</th><th>Description</th><th></th></tr>'
        + data.ROLES.map(function (r, i) {
          return '<tr><td><input type="text" id="PSROLEUSER_VW_ROLENAME$' + i + '" value="' + r + '" onchange="chg(this,\'ROLES\',' + i + ')"></td>'
            + '<td>' + (r ? r + ' role' : '') + '</td>'
            + '<td><a id="PSROLEUSER_VW$new$' + i + '$$0" href="javascript:submitAction_win0(document.win0,\'PSROLEUSER_VW$new$' + i + '$$0\')">+</a></td></tr>';
        }).join('') + '</table>';
    }
    h += '<br><input type="button" id="#ICSave" name="#ICSave" value="Save" onclick="submitAction_win0(this.form,this.name)">';
    p.innerHTML = h;
  }

  render();
})();
</script>
</body>
</html>
