# Hand-written on 2026-11-04 from the real pages on HR92U052. Not run yet: the first run is the test.
id: refresh_employees_table
title: Refresh the EMPLOYEES table (PER099)
summary: Submits Application Engine PER099 (Fill EMPLOYEES Table) from its run control page, which refreshes PS_EMPLOYEES
  as of a date.
examples:
- Refresh the EMPLOYEES table as of today
- Run PER099 as of 11/30/2026
component:
  menu: SETUP_HRMS
  component: RUN_PER099
  market: GBL
fields:
  run_control_id:
    label: Run Control ID
    required: true
    default: PSAGENT_HCM
    upper: true
    hint: Reusable run control; created if it does not exist.
  as_of_date:
    label: As Of Date
    required: true
    hint: MM/DD/YYYY. On or after the hire date of a new person, or that person will not appear.
playbook:
- do: open
  mode: add_or_open
  keys:
  - field:
      id: PRCSRUNCNTL_RUN_CNTL_ID
      label: Run Control ID
    value: '{{run_control_id}}'
  say: Opening Refresh the EMPLOYEES table
- do: set
  field:
    id: RUN_CNTL_HR_ASOFDATE
    label: As Of Date
  value: '{{as_of_date}}'
- do: click
  button:
    id: PRCSRQSTDLG_WRK_LOADPRCSRQSTDLGPB
    text: Run
- do: set
  field:
    id: PRCSRQSTDLG_WRK_SERVERNAME
    label: Server Name
  value: PRCS8622
  popup: true
- do: click
  button:
    id: '#ICSave'
    text: OK
  popup: true
- do: expect_process
