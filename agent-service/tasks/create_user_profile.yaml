# Recorded with PSAgent teach mode by PS on 2026-10-23.
# Edit freely: same format as the hand-written tasks (see README).
id: create_user_profile
title: Create user profile
summary: Adds a new PeopleSoft user profile with permission lists, an ID type, a description and an initial role.
examples:
- Create a user profile for JSMITH with description John Smith
- Add new user ZZTEST01 with role PeopleSoft User
component:
  menu: MAINTAIN_SECURITY
  component: USERMAINT
  market: GBL
recorded:
  by: PS
  'on': '2026-10-23'
fields:
  user_id:
    label: User ID
    required: true
    upper: true
    hint: New user ID, uppercase, up to 30 characters
  symbolic_id:
    label: Symbolic ID
    required: true
    default: SYSADM1
    hint: Database access profile symbolic ID
  password:
    label: Password
    required: true
    sensitive: true
  navigator_homepage:
    label: Navigator Homepage
    required: true
    default: PTPT1000
    upper: true
    hint: Permission list code
  primary_permission_list:
    label: Primary Permission List
    required: true
    default: PTPT1000
    upper: true
    hint: Permission list code
  process_profile:
    label: Process Profile
    required: true
    default: PTPT1000
    upper: true
    hint: Permission list code
  row_security:
    label: Row Security
    required: true
    default: PTPT1000
    upper: true
    hint: Permission list code
  description:
    label: Description
    required: true
    hint: Usually the user's full name
  role_name:
    label: Role Name
    required: true
    default: PeopleSoft User
    hint: Exact role name, e.g. PeopleSoft User
playbook:
- do: open
  mode: add
  keys:
  - field:
      id: PSOPRDEFN_SRCH_OPRID
      label: User ID
    value: '{{user_id}}'
  say: Opening Create user profile
- do: set
  field:
    id: PSOPRDEFN_SYMBOLICID
    label: Symbolic ID
  value: '{{symbolic_id}}'
- do: set
  field:
    id: PSUSRPRFL_WRK_PTPSWDCLEARTXTINPT
    label: New Password
  value: '{{secret:password}}'
- do: set
  field:
    id: PSUSRPRFL_WRK_PTPSWDCLEARTXTCONF
    label: Confirm Password
  value: '{{secret:password}}'
- do: set
  field:
    id: PSOPRDEFN_DEFAULTNAVHP
    label: Navigator Homepage
  value: '{{navigator_homepage}}'
- do: set
  field:
    id: PSOPRDEFN_OPRCLASS
    label: Primary
  value: '{{primary_permission_list}}'
- do: set
  field:
    id: PSOPRDEFN_PRCSPRFLCLS
    label: Process Profile
  value: '{{process_profile}}'
- do: set
  field:
    id: PSOPRDEFN_ROWSECCLASS
    label: Row Security
  value: '{{row_security}}'
- do: tab
  label: ID
- do: set
  field:
    id: PSOPRALIAS_OPRALIASTYPE$0
    label: ID Type
  value: None
- do: set
  field:
    id: PSOPRDEFN_DVW_OPRDEFNDESC$0
    label: Description
  value: '{{description}}'
- do: tab
  label: Roles
- do: set
  field:
    id: PSROLEUSER_VW_ROLENAME$0
    column: Role Name
  value: '{{role_name}}'
- do: click
  button:
    id: '#ICSave'
    text: Save
- do: expect_saved
